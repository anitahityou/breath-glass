<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,"><title>息 · Breath Glass</title><link rel="stylesheet" href="style.css"></head><body>
<canvas id="scene" aria-label="摄像头画面与可擦拭雾气"></canvas><video id="video" autoplay playsinline muted hidden></video><div class="shade"></div>
<header><span class="brand">息 <small>Breath Glass</small></span><span id="cameraState">● 摄像头未开启</span></header>
<main><div class="intro" id="intro"><h1>吹气成雾，指尖擦亮。</h1><p>对着镜头吹气，再伸出手指轻轻擦拭。</p></div><div class="liveHint" id="liveHint" hidden>面对镜头，微张嘴唇做「吹气」动作</div><div id="message" role="status" aria-live="polite"></div></main>
<footer><div class="controls"><button id="start">开启摄像头</button><button id="reset">重置雾气</button><details id="settings"><summary aria-label="调整灵敏度与效果">设置</summary><div class="settingsPanel"><div class="slider"><label for="sensitivity">吹气灵敏度 <output id="sensitivityValue">50</output></label><input id="sensitivity" type="range" min="0" max="100" value="50"></div><div class="slider"><label for="radius">擦拭半径 <output id="radiusValue">55 px</output></label><input id="radius" type="range" min="20" max="120" value="55"></div><label class="toggle" for="effects">擦拭动画 <input id="effects" type="checkbox" checked></label><button id="simulate">模拟吹气</button><aside class="telemetry"><div><i id="faceDot"></i> 人脸 <span id="faceStatus">等待人脸</span></div><div><i id="handDot"></i> 手势 <span id="handStatus">等待手势</span></div><div>吹气 <span id="breathValue">0%</span></div><div class="meter"><span id="breathBar"></span></div></aside><p>画面仅在本机处理<br>也可使用鼠标或触屏拖动擦拭</p></div></details></div></footer>
<script type="module" src="app.js"></script></body></html>
